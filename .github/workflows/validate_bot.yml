name: Validate changed bot modules

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile active changed modules
        run: |
          python -m py_compile \
            config.py \
            bot.py \
            helper/database.py \
            helper/ai_rename.py \
            helper/job_transfer.py \
            helper/clone_manager.py \
            plugins/ui.py \
            plugins/cb_data.py \
            plugins/rename_settings.py \
            plugins/file_action_fix.py \
            plugins/rename_reply_responder.py \
            plugins/thumb.py \
            plugins/metadata.py \
            helper/thumbnail_manager.py \
            helper/metadata.py \
            helper/ffmpeg.py \
            plugins/start.py \
            plugins/premium.py \
            plugins/rename.py
