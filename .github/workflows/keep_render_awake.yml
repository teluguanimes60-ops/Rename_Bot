name: Keep Render Bot Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_URL:-}" ]; then
            echo "RENDER_URL secret is not configured; skipping ping."
            exit 0
          fi

          URL="${RENDER_URL%/}/health"
          echo "Pinging ${URL}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 15 --max-time 90 \
            "${URL}"
          echo
